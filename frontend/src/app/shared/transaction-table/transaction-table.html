<div class="transaction-table__scroll">
  <table mat-table [dataSource]="transactions()">
    <ng-container matColumnDef="date">
      <th mat-header-cell *matHeaderCellDef>Datum</th>
      <td mat-cell *matCellDef="let transaction">{{ formatDate(transaction.date) }}</td>
    </ng-container>

    <ng-container matColumnDef="category">
      <th mat-header-cell *matHeaderCellDef>Kategorie</th>
      <td mat-cell *matCellDef="let transaction">
        <span
          class="category-chip"
          [style.background-color]="transaction.category.color + '1f'"
          [style.color]="transaction.category.color"
          [title]="transaction.category.name"
        >
          <mat-icon fontSet="material-symbols-outlined">{{ transaction.category.icon }}</mat-icon>
          <span class="category-chip__label">{{ transaction.category.name }}</span>
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef>Notiz</th>
      <td mat-cell *matCellDef="let transaction">{{ transaction.description }}</td>
    </ng-container>

    <ng-container matColumnDef="amount">
      <th mat-header-cell *matHeaderCellDef>Betrag</th>
      <td
        mat-cell
        *matCellDef="let transaction"
        [class.amount--income]="transaction.type === 'Income'"
        [class.amount--expense]="transaction.type === 'Expense'"
      >
        <app-money [amount]="signedAmount(transaction)" />
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let transaction">
        <button mat-icon-button type="button" (click)="edit.emit(transaction)" aria-label="Transaktion bearbeiten">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button type="button" (click)="delete.emit(transaction)" aria-label="Transaktion löschen">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns()"></tr>
  </table>
</div>
