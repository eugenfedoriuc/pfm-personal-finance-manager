<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>{{ data.message }}</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">{{ data.cancelLabel ?? 'Abbrechen' }}</button>
  <button mat-flat-button type="button" color="warn" (click)="confirm()">
    {{ data.confirmLabel ?? 'Löschen' }}
  </button>
</mat-dialog-actions>
