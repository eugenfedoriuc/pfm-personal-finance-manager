<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>PFM – Persönliche Finanzverwaltung</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Applies the saved theme before Angular boots, so there's no light/dark flash on load.
      (function () {
        var stored = localStorage.getItem('pfm-theme');
        var mode = stored;
        if (mode !== 'light' && mode !== 'dark') {
          mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.style.colorScheme = mode;
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
